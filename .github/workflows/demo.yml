name: Demo

on:
  push:
    branches: [ main, swift-6 ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-demo:
    # Current Xcode on the macOS 26 image (26.6 is its default). The demo is
    # the Swift 5 language mode consumer of the library.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
      - name: Generate demo project
        working-directory: Example
        run: xcodegen
      - name: Build demo (iOS Simulator)
        run: |
          xcodebuild \
            -project Example/FRadioPlayerDemo.xcodeproj \
            -scheme FRadioPlayerDemo \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

